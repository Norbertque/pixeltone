[package]
name = "pixeltone"
description = "Pixeltone — a Material 3 Expressive music player with bit-perfect WASAPI exclusive output"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "pixeltone"

[lib]
name = "pixeltone_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
crossbeam-channel.workspace = true
getrandom = "0.3"
parking_lot.workspace = true
pp-ai.workspace = true
pp-core.workspace = true
pp-decode.workspace = true
pp-deezer.workspace = true
pp-engine.workspace = true
pp-library.workspace = true
pp-lyrics.workspace = true
pp-remote.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.5"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
pp-media-controls.workspace = true
pp-output-wasapi.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Credentials", "Win32_System_Power"] }

[package]
name = "pixelplayer-pc"
description = "PixelPlayer PC — a Material 3 Expressive music player with bit-perfect WASAPI exclusive output"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "pixelplayer-pc"

[lib]
name = "pixelplayer_pc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
parking_lot.workspace = true
pp-core.workspace = true
pp-decode.workspace = true
pp-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
pp-output-wasapi.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Power"] }

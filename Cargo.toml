[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Norbertque"]
publish = false

[workspace.dependencies]
pp-core = { path = "crates/pp-core" }
pp-decode = { path = "crates/pp-decode" }
pp-engine = { path = "crates/pp-engine" }
pp-library = { path = "crates/pp-library" }
pp-output-wasapi = { path = "crates/pp-output-wasapi" }

anyhow = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
wasapi = "0.25"
windows = "0.62"
# FFmpeg 8.x, linked dynamically. Paths come from .cargo/config.toml (Linux dev)
# or from FFMPEG_* environment variables (CI); see scripts/fetch-ffmpeg.sh.
rsmpeg = { version = "0.18", default-features = false, features = ["ffmpeg8"] }

[profile.release]
codegen-units = 1
lto = "thin"

[package]
name = "pp-remote"
description = "Remote control for Pixeltone: phones on the same network find it, pair once and drive the player"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
parking_lot.workspace = true
pp-decode.workspace = true
pp-engine.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
socket2 = "0.6"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
ureq = "3.4"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_Dns"] }

[dev-dependencies]
pp-engine = { workspace = true }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "3.4", features = ["json"] }

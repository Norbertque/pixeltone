# Local development links the FFmpeg fetched by `scripts/fetch-ffmpeg.sh linux64`.
# Values here never override variables already set in the environment, so CI
# (which exports its own FFMPEG_* paths on Windows) is unaffected.
[env]
FFMPEG_DLL_PATH = { value = "third_party/ffmpeg/linux64/lib", relative = true }
FFMPEG_INCLUDE_DIR = { value = "third_party/ffmpeg/linux64/include", relative = true }
# The ffmpeg CLI that tests use to generate fixtures.
PP_FFMPEG = { value = "third_party/ffmpeg/linux64/bin/ffmpeg", relative = true }
# TypeScript bindings generated by ts-rs during `cargo test`.
TS_RS_EXPORT_DIR = { value = "ui/src/lib/api/bindings", relative = true }

# Linux binaries find the shared FFmpeg libraries relative to themselves
# (target/debug/deps/* for tests, target/debug/* for binaries). Classic RPATH rather than
# RUNPATH, so libraries FFmpeg loads indirectly (libswresample, …) are found too.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C",
    "link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../../../third_party/ffmpeg/linux64/lib:$ORIGIN/../../third_party/ffmpeg/linux64/lib",
]

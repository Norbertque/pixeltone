name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libclang-dev

      - name: Fetch FFmpeg
        run: scripts/fetch-ffmpeg.sh linux64

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

      - name: TypeScript bindings are up to date
        run: |
          changes="$(git status --porcelain -- ui/src/lib/api/bindings)"
          if [[ -n "$changes" ]]; then
            echo "Run cargo test and commit the regenerated bindings:"
            echo "$changes"
            exit 1
          fi

  ffmpeg:
    name: FFmpeg (audio-only, Windows)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Rebuilt only when the build script (version, components, flags) changes.
      - id: cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/win64
          key: ffmpeg-win64-slim-${{ hashFiles('scripts/build-ffmpeg-slim.sh') }}

      - name: Cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm make

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        # The win32 thread model: no libwinpthread to ship (the script checks).
        env:
          FFMPEG_CC: x86_64-w64-mingw32-gcc-win32
        run: scripts/build-ffmpeg-slim.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win64
          path: third_party/ffmpeg/win64
          retention-days: 3

  windows:
    name: Build (Windows)
    needs: [test, ffmpeg]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: FFmpeg
        uses: actions/download-artifact@v5
        with:
          name: ffmpeg-win64
          path: third_party/ffmpeg/win64

      - name: Configure build
        shell: pwsh
        run: |
          $ff = Join-Path $env:GITHUB_WORKSPACE 'third_party\ffmpeg\win64'
          "FFMPEG_DLL_PATH=$ff\lib" >> $env:GITHUB_ENV
          "FFMPEG_INCLUDE_DIR=$ff\include" >> $env:GITHUB_ENV
          "$ff\bin" >> $env:GITHUB_PATH
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $repo = 'https://github.com/${{ github.repository }}/releases'
          # Every build gets its own version, so the updater can tell which is newer: tags
          # use theirs, dev builds major.minor of the workspace plus the run number.
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $channel = '${{ github.ref_name }}'
            $feed = "$repo/latest/download/latest.json"
            "PP_BUILD_ID=" >> $env:GITHUB_ENV
          } else {
            $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.' |
              Select-Object -First 1).Matches[0].Groups
            $version = "$($base[1].Value).$($base[2].Value).${{ github.run_number }}"
            $channel = 'dev'
            $feed = "$repo/download/dev/latest.json"
            "PP_BUILD_ID=dev $sha" >> $env:GITHUB_ENV
          }
          "PP_CHANNEL=$channel" >> $env:GITHUB_ENV
          "PP_VERSION=$version" >> $env:GITHUB_ENV
          "PP_DOWNLOADS=$repo/download/$channel" >> $env:GITHUB_ENV
          @{ version = $version; plugins = @{ updater = @{ endpoints = @($feed) } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 ci-tauri.json
          Get-Content ci-tauri.json

      - run: npm ci

      - name: Unit tests
        run: cargo test -p pp-core -p pp-output-wasapi

      - name: Build installer
        env:
          # Signs the installer for the updater (generated with `tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --config ci-tauri.json

      - name: Package
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force artifacts
          $name = "Pixeltone-$env:PP_CHANNEL"
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "$out\$name-setup.exe"
          # The update feed: this version, its installer and the installer's signature.
          @{
            version = $env:PP_VERSION
            notes = "Built from ${{ github.sha }}"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                url = "$env:PP_DOWNLOADS/$name-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$out\latest.json"
          $portable = New-Item -ItemType Directory -Force "$out\portable\Pixeltone"
          Copy-Item target\release\pixeltone.exe $portable
          Copy-Item third_party\ffmpeg\win64\bin\*.dll $portable
          Compress-Archive -Path $portable -DestinationPath "$out\$name-portable.zip" -Force
          Get-ChildItem $out -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Pixeltone-${{ env.PP_CHANNEL }}
          path: artifacts/*.*
          retention-days: 14

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(artifacts/*.exe artifacts/*.zip artifacts/latest.json)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            gh release create "${{ github.ref_name }}" "${files[@]}" \
              --title "Pixeltone ${{ github.ref_name }}" --generate-notes
          else
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev "${files[@]}" --prerelease --target "${{ github.sha }}" \
              --title "Development build" \
              --notes "Version $PP_VERSION, built from ${{ github.sha }} on $(date -u +%Y-%m-%d). Unsigned: Windows SmartScreen will ask for confirmation (More info → Run anyway). Installed copies update themselves."
          fi
